# Day 6 — Stage 1: VRSBench-mix (caption + VQA) sub-sample.
#
# Goal: lift the base LFM2.5-VL-450M's nadir-EO understanding (description
# fluency, object grounding, short-answer QA) before Stage 2 specialises
# on the SatDiff contract output. Stage 1 alone won't close the contract-
# severity gap — that's Stage 2's job — but it teaches the model what
# remote-sensing imagery looks like, which is the precursor.
#
# Dataset: /home/peter/datasets/vrsbench/satdiff_stage1.jsonl
# Built by: training/build_stage1_dataset.py — 2,500 captions + 2,500 VQA
#   from the VRSBench train split, with [refer] examples excluded.
# Compute envelope: ~5–6 h on RTX 4080 12 GB (smoke = 32 s for 16 samples
#   × 1 epoch, so ~2 s/sample × 5K × 2 = ~5.5 h).

project_name: "satdiff_stage1"
model_name: "LFM2.5-VL-450M"
training_type: "vlm_sft"

dataset:
  path: "/home/peter/datasets/vrsbench/satdiff_stage1.jsonl"
  type: "vlm_sft"
  test_size: 0.05  # ~250 eval examples — enough to track loss without spending too much on eval

training_config:
  extends: "DEFAULT_VLM_SFT"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  logging_steps: 25
  save_strategy: "epoch"   # checkpoint at end of each epoch (LoRA + merged fp16)
  eval_strategy: "epoch"
  save_total_limit: 2
  output_dir: "/home/peter/leap-finetune/outputs/satdiff_stage1"

peft_config:
  extends: "DEFAULT_VLM_LORA"
  use_peft: true
